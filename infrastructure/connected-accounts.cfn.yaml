AWSTemplateFormatVersion: '2010-09-09'
Description: Connected Accounts App — Lambda BFF + S3 frontend + CloudFront + Route 53

# NOTE: Lambda Function URL is NOT in this template due to org CloudFormation hook
# (AWS::EarlyValidation::PropertyValidation blocks Function URLs via CF).
# Run post-deploy.sh after stack creation to add the Function URL and API CloudFront.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI for the Lambda function (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/connected-accounts-bff:latest)
  SessionSecret:
    Type: String
    NoEcho: true
    Description: Long random string used to encrypt the JWE session cookie
  Auth0Domain:
    Type: String
    Default: myid-selfservice.cic-demo-platform.auth0app.com
    Description: Auth0 domain (update to auth0connectedapps.demo-connect.us after CNAME propagates)
  Auth0BffClientId:
    Type: String
    Default: Xj1wLyzglZWH7V5XidOV4gkHvvxzDTla
  Auth0BffClientSecret:
    Type: String
    NoEcho: true
  Auth0ApiClientId:
    Type: String
    Default: IeYFlVzPrOq5TmOLpKJK3TbwUpYkdvfo
  Auth0ApiClientSecret:
    Type: String
    NoEcho: true
  OpenAiApiKey:
    Type: String
    NoEcho: true
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:204352680806:certificate/2cff1ec5-7936-49de-9c54-dd3a0c327baf
  HostedZoneId:
    Type: String
    Default: Z0779465JLQ9Q597U3NC
  FrontendDomain:
    Type: String
    Default: connectedapps.demo-connect.us
  ApiDomain:
    Type: String
    Default: connectedapps-api.demo-connect.us
  FrontendUrl:
    Type: String
    Default: https://connectedapps.demo-connect.us
  BackendUrl:
    Type: String
    Default: https://connectedapps-api.demo-connect.us

Resources:

  # ── DynamoDB: refresh tokens + pending connects (pre-existing, not managed by CF) ──
  # Table connected-accounts-refresh-tokens already exists; referenced by name in Lambda env.

  # ── DynamoDB: users ──────────────────────────────────────────────────────
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: connected-accounts-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: auth0UserId
          AttributeType: S
      KeySchema:
        - AttributeName: auth0UserId
          KeyType: HASH

  # ── DynamoDB: chat messages ──────────────────────────────────────────────
  ChatMessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: connected-accounts-chat-messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: auth0UserId
          AttributeType: S
        - AttributeName: messageId
          AttributeType: S
      KeySchema:
        - AttributeName: auth0UserId
          KeyType: HASH
        - AttributeName: messageId
          KeyType: RANGE

  # ── IAM: Lambda execution role ───────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: connected-accounts-bff-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/connected-accounts-refresh-tokens
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt UsersTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !GetAtt ChatMessagesTable.Arn

  # ── Lambda function (no Function URL — added via CLI post-deploy) ─────────
  BffFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: connected-accounts-bff
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          NODE_ENV: production
          AUTH0_DOMAIN: !Ref Auth0Domain
          AUTH0_BFF_CLIENT_ID: !Ref Auth0BffClientId
          AUTH0_BFF_CLIENT_SECRET: !Ref Auth0BffClientSecret
          AUTH0_API_CLIENT_ID: !Ref Auth0ApiClientId
          AUTH0_API_CLIENT_SECRET: !Ref Auth0ApiClientSecret
          AUTH0_AUDIENCE: api://discordGoogleConnectedAccounts
          SESSION_SECRET: !Ref SessionSecret
          BASE_URL: !Ref BackendUrl
          BACKEND_URL: !Ref BackendUrl
          FRONTEND_URL: !Ref FrontendUrl
          COOKIE_DOMAIN: .demo-connect.us
          DYNAMODB_REFRESH_TOKENS_TABLE: connected-accounts-refresh-tokens
          DYNAMODB_USERS_TABLE: connected-accounts-users
          DYNAMODB_CHAT_MESSAGES_TABLE: connected-accounts-chat-messages
          OPENAI_API_KEY: !Ref OpenAiApiKey

  # ── S3: frontend static assets ───────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub connected-accounts-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: connected-accounts-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── CloudFront: frontend distribution ────────────────────────────────────
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Connected Accounts frontend
        Aliases:
          - !Ref FrontendDomain
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          Compress: true
        # SPA routing: return index.html for any 404
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ── Route 53: frontend A record ───────────────────────────────────────────
  FrontendDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontendDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (always this value)
        EvaluateTargetHealth: false

Outputs:
  BffFunctionArn:
    Value: !GetAtt BffFunction.Arn
    Export:
      Name: connected-accounts-bff-arn
  FrontendBucketName:
    Value: !Ref FrontendBucket
    Export:
      Name: connected-accounts-frontend-bucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
    Export:
      Name: connected-accounts-frontend-cf-id
  FrontendDistributionDomain:
    Value: !GetAtt FrontendDistribution.DomainName
